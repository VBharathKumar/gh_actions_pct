name: first-workflow
on:
  pull_request:
    types: # used types
      - opened
      - closed
  workflow_dispatch:
  push:
    paths: # used filters
      - '.github/workflows/*'
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v3
      - name: installing-node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: caching the dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: dependencies-key-${{ hashFiles(**/package-lock.json) }}
      - name: installing packages
        run: npm install
      - name: run tests
        run: npm test

  second-job:
    outputs:
      ext-name1: ${{steps.out-file.outputs.ext-name}}
    needs: first-job
    runs-on: ubuntu-latest
    steps:
      - name: doing-codecheckout
        uses: actions/checkout@v3
      - name: installing-node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: caching dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: dependencies-key-${{ hashFiles('**/package-lock.json') }}
      - name: installing-dependencies
        run: npm install
      - name: build-artifact
        run: npm run build
      - name: publishing name of built files
        id: out-file
        run: find dist/assets/*.js -type f -execdir echo 'ext-name={}' >> $GITHUB_OUTPUT ';'
      - name: uploading-artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: dist/
      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
          path: ./man-created/ # downloading to custom directory
      - name: listing contents
        run: ls -lah

  third-job:
    needs: second-job
    runs-on: ubuntu-latest
    steps:
      - name: printing github context object
        run: echo "object ${{toJSON(github)}}"
      - name: printing out-put of second-job
        run: echo ${{needs.second-job.outputs.ext-name1}}
  
  fourth-job:
    needs: third-job
    runs-on: ubuntu-latest
    steps:
      - name: printing-event of github object
        run: echo "${{toJSON(github.event)}}"
